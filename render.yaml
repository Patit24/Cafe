services:
  - type: web
    name: evening-light-backend
    runtime: node
    rootDir: backend
    buildCommand: npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: evening-light-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: evening-light-db
    databaseName: evening_light
    user: evening_light_user
    plan: free
